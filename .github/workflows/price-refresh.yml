# Repo-side price refresh — see tools/price_check.py.
#
# What this does: runs tools/price_check.py against a handful of public GPU
# pricing sources, and if anything it validated CONFIRMED or MOVED (its
# terms — see the tool's own docstring), opens a pull request with the
# change. It never pushes to master (or any branch) directly, and never
# merges anything — that is an absolute project rule, not just a habit:
# the PR sits for the owner to review and merge by hand, the same as every
# other change in this repo.
#
# The suite runs here but does not gate the pull request, and that is the whole
# point of the job rather than a relaxed standard. A price move rewrites what
# every card displays and tests/golden/page.json records those strings verbatim,
# so any genuine price change turns the suite red. Gating on it made the job
# unable to ever propose one: it would apply the moves, fail, skip the PR step,
# and discard the report. The suite's result is reported instead — in the PR
# body, on the PR's own `suite` check, and in the artifact, which now uploads on
# every run rather than only on the runs that found nothing.
#
# This job needs no secrets: every source in tools/price_check.py's
# SOURCE_MAP is queried unauthenticated (verified live while the tool was
# built — see the PR that introduced it). If a source later requires a key
# (e.g. Vast.ai under load, or GCP if that ever gets automated), add it as
# a repo secret and reference it from tools/price_check.py directly; this
# workflow does not need to change to pass one through.
#
# Scheduled workflows are disabled by default on forks until the fork owner
# enables Actions there, so this does not silently start hitting the same
# sources from a fork the moment someone forks the repo.
name: Price refresh

on:
  schedule:
    # Weekly, not daily: catalog prices move on the order of weeks, and the
    # source research this tool is built on recommends staying a polite,
    # low-volume, identified caller against unauthenticated (Azure, AWS,
    # Vast) and undocumented (AWS's feed) endpoints — "one run per day or
    # week, single-digit request counts per provider."
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch: {} # manual run, e.g. to check a single source sooner

concurrency:
  group: price-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  price-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the branch the PR step opens
      pull-requests: write # to open (or update) that PR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Fetch, validate, and (where confirmed or moved) apply
        run: |
          python3 tools/price_check.py --apply --report-out "$RUNNER_TEMP/price-check-report.md"
        # Exits 0 for every *handled* outcome — a source whose shape changed,
        # a move too large to auto-apply, a thin marketplace sample. Those are
        # the point of the tool, not a job failure. A nonzero exit here means
        # something the tool itself doesn't know how to classify, e.g. a
        # SOURCE_MAP entry naming a catalog slug that no longer exists.

      - name: Re-sync generated blocks from data/gpus.json
        run: python3 tools/sync_data.py
        # A no-op print if nothing was applied. If a price *was* applied, the
        # GPU_TABLE blocks in index.html and generate_report.py must move
        # with it — this is what "never hand-edit a generated block" already
        # requires of any change to data/gpus.json, automated or not.

      - name: Check whether there is anything to propose
        id: diff
        run: |
          if git diff --quiet -- data/gpus.json index.html generate_report.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install what the image step and the test suite need
        if: steps.diff.outputs.changed == 'true'
        run: pip install pillow websockets reportlab pyyaml
        # google-chrome-stable ships on the ubuntu-latest image already.
        # pillow and websockets are tools/make_assets.py's own dependencies
        # (see its docstring); the planner and the suite need neither.
        # reportlab and pyyaml are the packages the suite itself needs:
        # tests/report.test.py imports generate_report.py as a real module,
        # and that exits without it. The first manual run of this job
        # installed only the first two and failed at the suite step.

      - name: Regenerate published images (index.html changed)
        if: steps.diff.outputs.changed == 'true'
        run: python3 tools/make_assets.py
      # The two delivery steps below carry `!cancelled()` rather than a bare
      # condition, and that is load-bearing rather than decorative. GitHub applies
      # "a default status check of `success()` ... unless you include one of these
      # functions", so a plain `if:` silently means `success() && ...` — and any
      # step that fails anywhere above would skip them. That is how the original
      # deadlock worked, and a later `exit 1` guarding something unrelated would
      # rebuild it without touching either step. `!cancelled()` makes the delivery
      # path immune to what happens before it instead of auditing what sits there.
      # The real gate is still `changed == 'true'`: if price_check.py fails, the
      # step that sets it never runs and the PR is not opened.

      - name: Run the full suite — recorded, not obeyed
        id: suite
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          ./tests/run.sh 2>&1 | tee "$RUNNER_TEMP/suite.log"
        # Deliberately not a gate, and the pipefail is load-bearing: the default
        # shell is `bash -e`, so without it `tee` would return 0 and every red
        # suite would record as a pass.
        #
        # Why this may not gate the PR: tests/golden/page.json records what every
        # card displays, prices included, verbatim. So `every card still displays
        # exactly what the golden records` fails on *any* real price move — a red
        # suite here is the expected outcome of this job doing its job, not a
        # reason to withhold the result. Gating on it meant the job could never
        # once propose a price change. The first scheduled run (2026-09-21,
        # 35596156657) applied its moves, changed 32 recorded surfaces, went red,
        # skipped the PR step and threw the report away with it.
        #
        # The red is diagnostic, so it is carried to a human: into the PR body
        # below, and into the artifact. NOT onto the PR's own `suite` check —
        # this comment claimed that and was wrong. A PR opened with GITHUB_TOKEN
        # "creates workflow runs in an approval-required state ... a user with
        # write access can start the runs by selecting Approve workflows to run",
        # so that check reports nothing until someone clicks. The PR body is the
        # only channel that speaks without being asked, which is why the step
        # below is fed `.outcome` and not `.conclusion`: one word there and the
        # body reports every red suite as a pass, with no backstop anywhere.
        #
        # Deciding whether those 32 surfaces were meant is the review, and
        # regenerating the golden on this branch is how it is recorded.

      - name: Tell the PR body what the suite did
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        env:
          SUITE: ${{ steps.suite.outcome }}
        run: |
          REPORT="$RUNNER_TEMP/price-check-report.md"
          # `>>` also creates it, which is what keeps the PR step below from
          # failing on a missing body-path if the tool wrote no report.
          {
            printf '\n\n---\n\n'
            if [ "$SUITE" = 'success' ]; then
              printf '**The full suite passed on this branch.** No recorded surface moved,\n'
              printf 'so nothing here changes what a card displays.\n'
            else
              printf '**The full suite is RED on this branch, and that is expected.**\n\n'
              printf 'A price move rewrites what the cards display, and `tests/golden/page.json`\n'
              printf 'records those strings verbatim. Read the tail below before assuming that\n'
              printf 'is the whole story — a suite can be red for a reason that has nothing to\n'
              printf 'do with prices, and this job cannot tell the difference:\n\n'
              printf '```\n'
              tail -n 25 "$RUNNER_TEMP/suite.log" 2>/dev/null || printf '(no suite log)\n'
              printf '```\n\n'
              printf 'If the moves are right, there are TWO goldens to regenerate on this\n'
              printf 'branch — tests/run.sh is `set -e`, so the log above stops at the first\n'
              printf 'and names only one:\n\n'
              printf '```\n'
              printf 'UPDATE_GOLDEN=1 node tests/model.test.js      # what the cards display\n'
              printf 'UPDATE_GOLDEN=1 python3 tests/report.test.py  # what the PDF says\n'
              printf '```\n\n'
              printf 'Commit both and read the diff — the diff is the review. Moves over 40%%\n'
              printf 'are flagged by the tool and left unapplied; they are a separate job.\n'
            fi
          } >> "$REPORT"

      - name: Open a pull request (never pushes to master)
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "price-refresh: update catalog prices and provenance"
          # A fixed branch name on purpose: if last week's PR is still open,
          # this pushes new commits onto it instead of piling up a second
          # one; if it was merged or closed, this starts a fresh one. That is
          # this action's own documented behavior for a recurring bot PR.
          branch: automation/price-refresh
          delete-branch: true
          title: "Price refresh: catalog prices moved"
          body-path: ${{ runner.temp }}/price-check-report.md
          add-paths: |
            data/gpus.json
            index.html
            generate_report.py
            assets/
          # `assets/` rather than `assets/*.png`: tools/make_assets.py writes
          # THREE files there, and the third is manifest.json, which records the
          # hash of the index.html the images were built from. The glob carried
          # the two images and dropped the manifest, so every price PR failed the
          # asset gate against a hash from before the prices moved — the bot had
          # regenerated it correctly and then left it behind.
          #
          # tests/golden/ is deliberately absent. The bot proposes prices; a
          # person decides the display strings moved for the right reason and
          # regenerates the goldens themselves.

      - name: Upload the report, whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-check-report
          # Was `changed == 'false'` — the report survived only on the runs that
          # had nothing to say, and evaporated on exactly the runs worth keeping.
          # Both 2026-09-17's report (recoverable only from closed PR #12's body)
          # and 2026-09-21's (not recoverable at all) were lost this way.
          path: |
            ${{ runner.temp }}/price-check-report.md
            ${{ runner.temp }}/suite.log
          if-no-files-found: warn
          retention-days: 90
